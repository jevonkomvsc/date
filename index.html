<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Elemen Audio Lokal (Pastikan file iris.mp3 ada di satu folder yang sama) -->
    <audio id="bg-music" loop>
      <source src="iris.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Envelope Screen -->
    <div id="envelope-container" onclick="playMusicAndOpen()">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>♡ Letter for You ♡</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Sabtu Ngedate yu</h1>

        <img src="cat_heart.gif" class="cat" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <p id="final-text" class="final-text" style="display: none">
          <strong>YEYY, I jemput jam 13.30 yaaa. I LOVEEE YOUU BABEE</strong>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      // Fungsi tambahan agar lagu berputar saat amplop diklik
      function playMusicAndOpen() {
        const music = document.getElementById('bg-music');
        music.play().catch(error => {
          console.log("Audio play diblokir browser, butuh interaksi user:", error);
        });
      }
    </script>
  </body>
</html>
